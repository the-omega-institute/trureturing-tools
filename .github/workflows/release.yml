name: Publish a tested tools preview

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Tested branch name or pr/NUMBER to preview'
        required: true
        default: dev

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve the tested source and artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          SERIES: ${{ vars.TOOLS_RELEASE_SERIES || '0.1.0' }}
        run: python3 .github/scripts/preview-source.py
      - name: Check the CI archive against the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARTIFACT: ${{ steps.source.outputs.artifact }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          python3 package_release.py --revision "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > "$RUNNER_TEMP/ci.zip"
          unzip -p "$RUNNER_TEMP/ci.zip" trureturing-tools.tar.gz | cmp - build/trureturing-tools.tar.gz
      - id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-preview-${{ github.run_attempt }}
          path: build/trureturing-tools.tar.gz
          if-no-files-found: error
          retention-days: 1

  preview:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publish the verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: bash .github/scripts/publish-release.sh preview "$RUNNER_TEMP/release/trureturing-tools.tar.gz"
