name: Build and release tools

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      source:
        description: 'Branch name or pr/NUMBER to preview'
        required: true
        default: dev

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: source
        env:
          SOURCE: ${{ inputs.source }}
          SERIES: ${{ vars.TOOLS_RELEASE_SERIES || '0.1.0' }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/dev ]] || { echo 'Dispatch previews from dev'; exit 1; }
            if [[ "$SOURCE" =~ ^pr/([1-9][0-9]*)$ ]]; then
              ref="refs/pull/${BASH_REMATCH[1]}/head"
              channel="pr.${BASH_REMATCH[1]}"
            else
              ref="refs/heads/$SOURCE"
              git check-ref-format "$ref"
              channel=feature
              if [[ "$SOURCE" == dev ]]; then channel=dev; fi
            fi
            sha=$(git ls-remote --exit-code --refs origin "$ref" | cut -f1)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$SERIES" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            tag="v$SERIES-$channel.$GITHUB_RUN_NUMBER.g${sha:0:12}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: source
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: make -C tools dotnet
      - run: python3 .github/scripts/test-suites.py standalone
      - run: python3 package_release.py
      - id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tools-release-${{ github.run_attempt }}
          path: build/trureturing-tools.tar.gz
          if-no-files-found: error
          retention-days: 14

  contract:
    needs: source
    name: Consumer fixture ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: the-omega-institute/trureturing
          ref: 0eef94604888fa53d0b2807270597027f20c5968
          path: fixture
          persist-credentials: false
      - name: Install candidate sources into the pinned test fixture
        run: |
          set -euo pipefail
          git -C fixture rm --quiet -r -- tools
          git -C candidate archive HEAD tools | tar -xf - -C fixture
          git -C fixture add --force -- tools
          git -C fixture -c user.name=fixture -c user.email=fixture@invalid commit --allow-empty -qm 'Test candidate tools'
          test "$(git -C fixture rev-parse HEAD:tools)" = "$(git -C candidate rev-parse HEAD:tools)"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: fixture/global.json
      - name: Exercise candidate tools against the consumer fixture
        working-directory: fixture
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 ../candidate/.github/scripts/test-suites.py contract "$SHARD" 4

  preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    needs: [source, verify, contract]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publish the verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: bash .github/scripts/publish-release.sh preview "$RUNNER_TEMP/release/trureturing-tools.tar.gz"
