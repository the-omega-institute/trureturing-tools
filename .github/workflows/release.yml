name: Build and release tools

on:
  pull_request:
  push:
    branches: [dev]
    tags: ['v*', '!v*-dev.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.revision.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: make -C tools dotnet
      - run: python3 .github/scripts/test-suites.py standalone
      - name: Build the source archive
        run: python3 package_release.py
      - id: upload
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push'
        with:
          name: tools-release-${{ github.run_attempt }}
          path: build/trureturing-tools.tar.gz
          if-no-files-found: error

  contract:
    name: Consumer fixture ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: the-omega-institute/trureturing
          ref: 0eef94604888fa53d0b2807270597027f20c5968
          path: fixture
          persist-credentials: false
      - name: Install candidate sources into the pinned test fixture
        run: |
          set -euo pipefail
          git -C fixture rm --quiet -r -- tools
          git -C candidate archive HEAD tools | tar -xf - -C fixture
          git -C fixture add --force -- tools
          git -C fixture -c user.name=fixture -c user.email=fixture@invalid commit --allow-empty -qm 'Test candidate tools'
          test "$(git -C fixture rev-parse HEAD:tools)" = "$(git -C candidate rev-parse HEAD:tools)"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: fixture/global.json
      - name: Exercise candidate tools against the consumer fixture
        working-directory: fixture
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 ../candidate/.github/scripts/test-suites.py contract "$SHARD" 4

  publish:
    if: github.event_name == 'push'
    needs: [verify, contract]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.source }}
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          merge-multiple: true
      - name: Publish or verify the tag's asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ needs.verify.outputs.source }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          asset=trureturing-tools.tar.gz
          TAG="$REF_NAME"
          preview=false
          release_flags=()
          if [[ "$REF_TYPE" == branch ]]; then
            TAG="v0.1.0-dev.$GITHUB_RUN_NUMBER"
            preview=true
            release_flags=(--prerelease --latest=false)
            existing_ref=$(git ls-remote --refs origin "refs/tags/$TAG")
            if [[ -z "$existing_ref" ]]; then
              git push origin "$SOURCE:refs/tags/$TAG"
            fi
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$SOURCE" ]]
          if metadata=$(gh release view "$TAG" --json isDraft,isPrerelease,assets); then
            [[ "$(jq -r '.isPrerelease' <<< "$metadata")" == "$preview" ]]
            draft=$(jq -r '.isDraft' <<< "$metadata")
            if [[ "$draft" == true ]] && ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' <<< "$metadata" >/dev/null; then
              gh release upload "$TAG" "$asset"
            fi
            gh release download "$TAG" --pattern "$asset" --dir "$RUNNER_TEMP/existing"
            cmp "$asset" "$RUNNER_TEMP/existing/$asset"
            if [[ "$draft" == true ]]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            sha256sum "$asset" > "$RUNNER_TEMP/checksum"
            gh release create "$TAG" "$asset" "${release_flags[@]}" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/checksum"
          fi
