name: Test tools

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore the pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: tools-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - run: make -C tools dotnet
      - name: Run standalone suites
        env:
          CI_DOTNET_PREPARED: '1'
          CI_DOTNET_EVIDENCE_PREPARED: '1'
        run: python3 .github/scripts/test-suites.py standalone
  contract:
    name: Consumer fixture ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1', '2', '3', architecture, templates, judge, recovery, scoped, modules, remaining, frozen]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: the-omega-institute/trureturing
          ref: 25e45b4d5ff0ef4e26d1d29839131c5ad6411ccd
          path: fixture
          persist-credentials: false
      - name: Install the candidate archive in the pinned consumer
        run: python3 candidate/.github/scripts/install-fixture.py fixture
      - name: Test the release bootstrap and pinning
        if: matrix.shard == '0'
        working-directory: fixture
        run: python3 -m unittest discover -s tools/consumer/tests
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: fixture/global.json
          cache: true
          cache-dependency-path: 'fixture/**/packages.lock.json'
      - name: Restore the pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: tools-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fixture/lean-toolchain') }}
      - name: Exercise candidate tools against the consumer fixture
        working-directory: fixture
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 ../candidate/.github/scripts/test-suites.py contract "$SHARD"

  package:
    needs: [verify, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 package_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tools-release-${{ github.run_attempt }}
          path: build/trureturing-tools.tar.gz
          if-no-files-found: error
          retention-days: 14
